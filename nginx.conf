upstream server {
    server server:5007;
}

server {
    listen 80;
    server_name _;

    # 上传文件体积上限（与 upload.ts MAX_FILE_SIZE 200MB 对齐）
    client_max_body_size 200m;

    # 安全响应头（双重保障，Elysia 层已设置）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP（Report-Only）—— 仅上报不阻断，策略与 apps/server/src/plugins/security-headers.ts 的 CSP_POLICY 同步。
    # 浏览器把违规 POST 到 /api/csp-report；确认线上零违规后改为 Content-Security-Policy enforce。
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-report" always;

    # API + SSE proxy
    location /api/ {
        proxy_pass http://server;
        proxy_http_version 1.1;

        # SSE support — no buffering, keep-alive
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
