# Production override for the main compose file.
#
# Usage:
#   docker compose --profile prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires .env with at least: DB_PASSWORD, DASHSCOPE_API_KEY, JWT_SECRET

services:
  postgres:
    environment:
      POSTGRES_USER: ${DB_USER:-excuse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-excuse}
    ports:
      - '${DB_PORT:-5432}:5432'

  server:
    build:
      context: .
      target: server
    environment:
      DATABASE_URL: postgres://${DB_USER:-excuse}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-excuse}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - '${SERVER_PORT:-5007}:5007'

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://${DB_USER:-excuse}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-excuse}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY}
      NODE_ENV: production
      WORKER_HEALTH_PORT: '5100'
    ports:
      - '${WORKER_HEALTH_PORT:-5100}:5100'

  client:
    build:
      context: .
      target: client
    ports:
      - '${HTTP_PORT:-80}:80'
