name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 所有 job 复用根 package.json 脚本，与 docs/TODO.md 验收命令保持同口径。
# 任一 package 测试失败都能阻断 PR；Dockerfile 变更必须经过 CI build。

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check:boundaries

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  # 全量测试：复用根 `bun run test`（concurrently 跑 server + worker + 全部 packages），
  # 覆盖此前 CI 漏跑的 auth / canvas-engine / canvas-runtime / error-recovery / events /
  # gateway / metrics / provider-health / rate-limit / storage / subtitle-engine / ffmpeg /
  # task-engine / workflow-engine / prompt-engine。
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: excuse
          POSTGRES_PASSWORD: excuse_ci
          POSTGRES_DB: excuse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://excuse:excuse_ci@localhost:5432/excuse_test
      DASHSCOPE_API_KEY: test-key
      JWT_SECRET: test-jwt-secret-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply DB migrations
        run: cd packages/db && bun run db:push
      - name: Run all package + app tests
        run: bun run test

  # DB 集成测试（packages/db repo 测试）：此前从未在 CI 跑过。
  # test-db.ts / helpers 均已支持 DATABASE_URL，复用上面的 postgres service。
  test-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: excuse
          POSTGRES_PASSWORD: excuse_ci
          POSTGRES_DB: excuse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://excuse:excuse_ci@localhost:5432/excuse_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run DB integration tests
        run: bun run test:db

  client-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:client

  # 端到端冒烟（docs/TODO.md §三、1）：真实 server + worker + Postgres + SSE，
  # provider 由 fake 适配器注入（经 createServerContext/createWorkerContext overrides），
  # 不访问真实 DashScope。复用 test job 的 postgres service + db:push 口径。
  # typecheck:e2e 已由 typecheck job 覆盖（纳入根 typecheck 并发链）。
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: excuse
          POSTGRES_PASSWORD: excuse_ci
          POSTGRES_DB: excuse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://excuse:excuse_ci@localhost:5432/excuse_test
      DASHSCOPE_API_KEY: fake-e2e-key
      JWT_SECRET: e2e-test-jwt-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply DB migrations
        run: cd packages/db && bun run db:push
      - name: Run E2E smoke suite
        run: bun run test:e2e

  # Docker build：Dockerfile 变更必须经过 CI build，部署问题不到发布时才发现。
  # 验证 server / worker image target 能 build（client target 走 nginx，单独验证）。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: false
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
